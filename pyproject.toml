[project]
name = "braindance"
version = "0.1.0"
description = "Live 2D-to-3D desktop and SBS video on VITURE Luma Ultra glasses"
requires-python = "==3.12.*"
dependencies = [
    # Depth: inference, ONNX export and TensorRT engines. The GPU stack is
    # pinned as a set: torch's CUDA build, TensorRT and cuda-bindings must match
    # each other and the driver.
    "torch==2.12.1",
    "tensorrt-cu13==11.1.0.106",
    "cuda-bindings==13.3.1",
    "transformers>=5.12.1,<6",
    "onnx>=1.22.0,<2",
    # Capture bridge and rendering
    "moderngl>=5.12.0,<6",
    "glfw>=2.10.0,<3",
    # Input, panel text, arrays
    "python-xlib>=0.33,<0.34",
    "pillow>=12.2.0,<13",
    "numpy>=2.5.0,<3",
    # 3D video playback (binds the system's libmpv)
    "mpv>=1.0.8,<2",
    # 3D models (glTF / GLB) for `braindance view`
    "trimesh>=5.1,<6",
]

[project.scripts]
braindance = "braindance.cli:main"
braindance-build-engine = "braindance.engines:main"

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
